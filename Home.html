<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home page </title>

    <!-- daisy ui cdn -->

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <!-- tailwind cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome cdn -->
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

</head>

<body class="bg-[#f4f5f7] h-[100vh] max-w-lg mx-auto">

    <div class=" max-w-lg mx-auto ">
        <div class="flex justify-between items-center border-b-1 border-gray-300 p-3">
            <div class="flex">
                <img src="./assets/Group.png" class="h-[50px]" alt="">

                <div class="ml-3">
                    <h2 class=" font-bold">$<span id="main-amount">45000</span></h2>
                    <p class="text-[#08080880]">Availble Balance</p>
                </div>
            </div>

            <div class="">
                <button class="btn text-[#08080880] "><i
                        class="fa-solid fa-right-from-bracket rotate-180 text-gray-700"></i>Lougout</button>
            </div>
        </div>


        <div class="">
            <div class="max-w-lg mx-auto ">
                <h1 class="font-bold">🔥 Welcome to Payooo!</h1>
                <p class="text-[#08080880]">Enjoy easy and convenient financial services with us. Cashout charge is low
                    and
                </p>
            </div>

            <div class="text-center bg-[#FFFFFF] mt-[50px] p-4 grid grid-cols-3 gap-10 ">

                <div class="p-5 border-gray-300 rounded-lg shadow-sm">
                    <img src="./assets/wallet1.png" class="mx-auto mb-5" alt="">
                    <h1>Add Money</h1>
                </div>

                <div class="p-5 border-gray-300 rounded-lg shadow-sm">
                    <img src="./assets/send1.png" class="mx-auto mb-2" alt="">
                    <h1>Cashout</h1>
                </div>

                <div class="p-5 border-gray-300 rounded-lg shadow-sm">
                    <img src="./assets/money1.png" class="mx-auto mb-2" alt="">
                    <h1>Transfer Money</h1>
                </div>

                <div class="p-5 border-gray-300 rounded-lg shadow-sm">
                    <img src="./assets/bonus1.png" class="mx-auto mb-2" alt="">
                    <h1>Get Bonus</h1>
                </div>

                <div class="p-5 border-gray-300 rounded-lg shadow-sm">
                    <img src="./assets/purse1.png" class="mx-auto mb-2" alt="">
                    <h1>Pay Bill</h1>
                </div>

                <div class="p-5 border-gray-300 rounded-lg shadow-sm">
                    <img src="./assets/transaction1.png" class="mx-auto mb-2" alt="">
                    <h1>Transactions</h1>
                </div>

            </div>

        </div>
    </div>

    <!-- all from  -->
    <div class="max-w-lg mx-auto bg-[#FFFFFF] ">
        <h1 class="text-bold font-bold my-5">Add Money</h1>
        <form class="bg-white rounded-2xl p-8 shadow-sm">

            <div class="from-div  ">
                <h1 class="font-semibold ">Select A Bank</h1>
                <select id="bank" class="select bg-[#f4f5f7] mt-3 rounded-2xl w-full">
                    <option>select bank</option>
                    <option>prime Bank</option>
                    <option>ucb bank</option>
                    <option>ibbl Bank</option>
                </select>
            </div>


            <div class="from-div">


                <label class="font-semibold text-bold" for="">Bank Account Number</label> <br>
                <input id="account-number" type="text" placeholder="Enter 11 digit account number"
                    class="input bg-[#f4f5f7] mt-3 rounded-3xl w-full" />
            </div>
            <div class="from-div">
                <!-- <h1>Amount to Add</h1> -->
                <label class="font-semibold text-bold" for="">Amount to Add</label> <br>
                <input id="add-amount" type="text" placeholder="Add Amount to withdraw"
                    class="input bg-[#f4f5f7] mt-3 rounded-3xl w-full " />

            </div>
            <div class="from-div">
                <label class="font-semibold text-bold" for="">4 digit pin</label> <br>
                <input id="pin" type="text" placeholder="4 digit pin" class="input bg-[#f4f5f7] mt-3 rounded-3xl w-full"
                    id="pin-number" />
            </div>
            <button type="button" class="btn bg-[#0874f2] mt-5 rounded-3xl max-w-lg mx-auto w-full text-white"
                id="add-money-btn">Add
                Money</button>


        </form>
    </div>
    </div>

    <script src="Home.js"></script>
</body>

</html>
