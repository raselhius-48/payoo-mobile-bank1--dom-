<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> payoo-mobile-bank1--dom </title>

    <!-- daisy ui cdn -->

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <!-- tailwind cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


</head>

<body class="bg-[#f4f5f7] flex justify-center items-center p-25px">
    <form class=" w-[350px] bg-white rounded-2xl p-10">
        <div class="mt-5">
            <div
                class="h-[130px] w-[300px] font-semibold bg-[url(assets/bg.png)] bg-cover flex justify-center items-center">
                <img src="assets/Group.png" alt="">

            </div>
            <label class="font-semibold text-bold" for="">Mobile Number</label> <br>
            <input type="text" placeholder="your mobile number" class="input bg-[#f4f5f7] mt-3 rounded-3xl "
                id="mobile-number" />
        </div>
        <div class="mt-5">
            <label class="font-semibold text-bold" for="">4 digit pin</label> <br>
            <input type="text" placeholder="4 digit pin" class="input bg-[#f4f5f7] mt-3 rounded-3xl" id="pin-number" />
        </div>
        <button type="button" class="btn bg-[#0874f2] mt-5 rounded-3xl w-[250px] text-white"
            id="login-buttom">Login</button>
    </form>



    <script src="script.js"></script>
</body>

</html>
